{% extends 'base.html' %}

{% block content %}
    <h1>
        {% if form.instance.pk %}
            Edit sneaker
        {% else %}
            Add sneaker
        {% endif %}
    </h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>

    <a href="{% url 'collection_list' %}">Cancel</a>
{% endblock %}
