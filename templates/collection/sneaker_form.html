{% extends 'base.html' %}

{% block content %}
    <h1>Add a new sneaker to the catalog</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save sneaker</button>
    </form>

    <a href="{% url 'collection_create' %}" class="btn btn-cancel">Cancel</a>
{% endblock %}
